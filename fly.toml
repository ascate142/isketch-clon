# ============================================
# iSketch Clásico - Fly.io Configuration
# ============================================
# Despliegue: fly launch && fly deploy
# ============================================

app = "isketch-clon"
primary_region = "iad"

[build]

[deploy]
  release_command = ""

[env]
  PORT = "8080"
  NODE_ENV = "production"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256
  auto_throttle = true

# Health check
[http_service.checks]
  [http_service.checks.header]
    name = "health"
    path = "/api/geoip"
    interval = "30s"
    timeout = "5s"

# Volumes (si necesitas persistencia)
