plugins {
    id 'com.android.application'
}

android {
    namespace 'net.isketch.game'
    compileSdk 34

    defaultConfig {
        applicationId "net.isketch.game"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
        missingDimensionStrategy 'tvscreen', 'nowindows'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.leanback:leanback:1.1.0'
}
